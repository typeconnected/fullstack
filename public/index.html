<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Todo App — Full Stack Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 60px auto;
    padding: 0 20px;
    background: #f4f5f7;
    color: #1a1a1a;
  }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; margin-bottom: 24px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #4338ca; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }
  li:last-child { border-bottom: none; }
  li.done span { text-decoration: line-through; color: #999; }
  li span { flex: 1; cursor: pointer; }
  .del {
    background: transparent;
    color: #d33;
    font-size: 0.85rem;
    padding: 4px 8px;
  }
  .empty { color: #999; text-align: center; padding: 20px 0; }
  .status { font-size: 0.8rem; color: #999; margin-top: 20px; text-align: center; }
</style>
</head>
<body>
  <h1>📝 Todo App</h1>
  <p class="sub">Full-stack test project — Node.js + PostgreSQL</p>

  <div class="card">
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="নতুন কাজ লিখুন..." required />
      <button type="submit">যোগ করুন</button>
    </form>
    <ul id="todo-list"></ul>
    <div id="empty-msg" class="empty" style="display:none;">কোনো টাস্ক নেই। একটা যোগ করুন!</div>
  </div>

  <div class="status" id="status">লোড হচ্ছে...</div>

  <script src="script.js"></script>
</body>
</html>
